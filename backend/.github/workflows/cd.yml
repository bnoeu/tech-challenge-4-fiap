name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  # ─── Aguarda CI passar antes de fazer deploy ──────────────────────────────────
  wait-ci:
    name: Aguardar CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Testes Backend
        run: npm ci && npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm ci && npm run build

  # ─── Build e push das imagens Docker ─────────────────────────────────────────
  docker-publish:
    name: Publicar Imagens Docker
    runs-on: ubuntu-latest
    needs: wait-ci
    permissions:
      contents: read
      packages: write       # necessário para o GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login GHCR
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build e push — API
      - name: Build e Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tech-challenge-api:latest
            ghcr.io/${{ github.repository_owner }}/tech-challenge-api:${{ github.sha }}

      # Build e push — Frontend
      - name: Build e Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tech-challenge-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tech-challenge-frontend:${{ github.sha }}

      # Resumo no GitHub Actions
      - name: Resumo do deploy
        run: |
          echo "## Imagens publicadas 🐳" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "### GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/tech-challenge-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/tech-challenge-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
